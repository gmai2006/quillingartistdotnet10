<div ng-if="!$ctrl.product" class="container mx-auto px-4 py-20 text-center text-xl text-gray-500">
  Product not found.
</div>

<div ng-if="$ctrl.product" class="container mx-auto px-4 py-8">
  <div class="flex flex-col gap-8 lg:flex-row">

    <div class="w-full lg:w-2/3">

      <div class="mb-10 flex flex-col gap-8 md:flex-row">

        <div class="flex w-full items-center justify-center md:w-5/12">
          <img ng-src="/{{ $ctrl.product.imageUrl }}"
               class="max-h-[400px] w-full rounded-lg object-contain"
               alt="{{ $ctrl.product.name }}" />
        </div>

        <div class="w-full md:w-7/12">
          <h1 class="mb-4 text-2xl font-bold text-gray-800">{{ $ctrl.product.name }}</h1>

          <div class="mb-6">
            <span class="text-3xl font-bold text-gray-900">{{ $ctrl.product.price | currency:'$':2 }}</span>
          </div>

          <div class="mb-8 flex flex-wrap items-center gap-4">

            <div class="flex items-center overflow-hidden rounded-md border border-gray-300 bg-white">
              <button type="button"
                      class="flex h-10 w-10 items-center justify-center bg-gray-100 text-gray-600 transition-colors hover:bg-gray-200"
                      ng-click="$ctrl.decrement()">
                <lucide-icon name="Minus" icon-class="h-4 w-4"></lucide-icon>
              </button>
              <input type="text"
                     class="h-10 w-12 border-x border-gray-300 text-center outline-none"
                     value="{{ $ctrl.quantity }}"
                     readonly />
              <button type="button"
                      class="flex h-10 w-10 items-center justify-center bg-gray-100 text-gray-600 transition-colors hover:bg-gray-200"
                      ng-click="$ctrl.increment()">
                <lucide-icon name="Plus" icon-class="h-4 w-4"></lucide-icon>
              </button>
            </div>

            <button type="button"
                    class="flex items-center gap-2 rounded-md bg-blue-600 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-blue-700 shadow-sm"
                    ng-click="$ctrl.addToCart()">
              <lucide-icon name="ShoppingCart" icon-class="h-5 w-5"></lucide-icon>
              Add to cart
            </button>

            <button type="button"
                    class="flex items-center gap-2 rounded-md bg-yellow-500 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-yellow-600 shadow-sm"
                    ng-click="$ctrl.buyNow()">
              <lucide-icon name="CreditCard" icon-class="h-5 w-5"></lucide-icon>
              Buy now
            </button>

            <button type="button"
                    class="flex items-center justify-center rounded-md border border-gray-300 bg-white p-2.5 text-gray-500 transition-colors hover:bg-gray-50 hover:text-red-500"
                    title="Add to wishlist">
              <lucide-icon name="Heart" icon-class="h-5 w-5"></lucide-icon>
            </button>
          </div>

          <div class="rounded-lg bg-gray-50 p-4 border border-gray-100">
            <p class="mb-2 font-semibold text-gray-800">Product Highlights</p>
            <ul class="list-inside list-disc space-y-1 text-sm text-gray-600">
              <li>Handmade</li>
              <li>Material: paper, glue</li>
              <li>{{ $ctrl.product.description }}</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="mt-8">
        <div class="flex border-b border-gray-200">
          <button type="button"
                  class="px-4 py-3 text-sm font-medium transition-colors"
                  ng-class="$ctrl.activeTab === 'details' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700'"
                  ng-click="$ctrl.activeTab = 'details'">
            Details
          </button>
          <button type="button"
                  class="px-4 py-3 text-sm font-medium transition-colors"
                  ng-class="$ctrl.activeTab === 'shipping' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500 hover:text-gray-700'"
                  ng-click="$ctrl.activeTab = 'shipping'">
            Shipping &amp; Returns
          </button>
        </div>

        <div class="py-6 text-sm text-gray-600" ng-switch="$ctrl.activeTab">
          <product-details-info ng-switch-when="details"></product-details-info>
          <shipping-returns ng-switch-when="shipping"></shipping-returns>
        </div>
      </div>
    </div>

    <div class="w-full lg:w-1/3">
      <div class="sticky top-6">
        <h3 class="mb-4 text-lg font-bold text-gray-800 border-b pb-2">Featured Products</h3>
        <card-featured-product products="$ctrl.featured"></card-featured-product>
      </div>
    </div>

  </div>
</div>
