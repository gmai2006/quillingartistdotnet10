<form ng-submit="$ctrl.submit()" class="space-y-4">

  <div class="grid md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1" for="contact-name">Name</label>
      <div class="flex items-center rounded-md border px-3">
        <lucide-icon name="User" size="18" icon-class="text-gray-400 mr-2"></lucide-icon>
        <input id="contact-name" type="text" name="name" ng-model="$ctrl.form.name"
               placeholder="Your full name" required maxlength="50"
               class="w-full py-2 outline-none" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1" for="contact-company">Company</label>
      <div class="flex items-center rounded-md border px-3">
        <lucide-icon name="Building2" size="18" icon-class="text-gray-400 mr-2"></lucide-icon>
        <input id="contact-company" type="text" name="company" ng-model="$ctrl.form.company"
               placeholder="Your company name" required maxlength="50"
               class="w-full py-2 outline-none" />
      </div>
    </div>
  </div>

  <div class="grid md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1" for="contact-mobile">Mobile No</label>
      <div class="flex items-center rounded-md border px-3">
        <lucide-icon name="Phone" size="18" icon-class="text-gray-400 mr-2"></lucide-icon>
        <input id="contact-mobile" type="tel" name="mobileNo" ng-model="$ctrl.form.mobileNo"
               placeholder="Mobile no with country code" required
               class="w-full py-2 outline-none" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1" for="contact-email">Email Address</label>
      <div class="flex items-center rounded-md border px-3">
        <lucide-icon name="Mail" size="18" icon-class="text-gray-400 mr-2"></lucide-icon>
        <input id="contact-email" type="email" name="email" ng-model="$ctrl.form.email"
               placeholder="Your email address" required maxlength="50"
               class="w-full py-2 outline-none" />
      </div>
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium mb-1" for="contact-message">Message</label>
    <textarea id="contact-message" name="message" ng-model="$ctrl.form.message"
              placeholder="What you are looking for?" maxlength="1000" rows="4"
              class="w-full rounded-md border p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
  </div>

  <label class="flex items-start gap-2 text-sm">
    <input type="checkbox" name="informed" ng-model="$ctrl.form.informed" class="mt-1" />
    Keep me informed via email or phone about its Products and Services.
  </label>

  <button type="submit" class="w-full rounded-md bg-blue-600 py-2 font-medium text-white hover:bg-blue-700">
    Submit
  </button>

</form>
