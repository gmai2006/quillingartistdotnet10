<header class="border-b bg-gray-50 p-4">
  <div class="container mx-auto px-4">
    <div class="flex flex-col items-center gap-4 md:flex-row md:justify-between">

      <div class="flex shrink-0 items-center justify-center md:justify-start md:w-1/4">
        <a href="/" class="flex items-center gap-2 text-xl font-bold text-gray-800 hover:opacity-80">
          <img alt="logo" src="/favicon-32x32.png" class="h-8 w-8" />
          <span>Quilling Art</span>
        </a>
      </div>

      <div class="w-full md:w-1/2">
        <search-box></search-box>
      </div>

      <div class="flex justify-center md:w-1/4 md:justify-end">
        <div class="relative">
          <a ng-if="$ctrl.cart.count() > 0"
             href="/cart"
             class="inline-flex items-center rounded-lg bg-blue-600 p-2 text-white transition-colors hover:bg-blue-700 shadow-sm">
            <lucide-icon name="ShoppingCart" icon-class="h-6 w-6"></lucide-icon>
            <span class="absolute -top-2 -right-2 flex h-5 w-5 items-center justify-center rounded-full bg-red-600 text-[10px] font-bold text-white">
              {{ $ctrl.cart.count() }}
            </span>
          </a>
          <div ng-if="$ctrl.cart.count() <= 0"
               class="inline-flex cursor-not-allowed items-center rounded-lg bg-gray-400 p-2 text-white opacity-60 shadow-sm">
            <lucide-icon name="ShoppingCart" icon-class="h-6 w-6"></lucide-icon>
          </div>
        </div>
      </div>

    </div>
  </div>
</header>
