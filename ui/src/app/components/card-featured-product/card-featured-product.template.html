<div ng-if="$ctrl.products.length > 0"
     class="my-4 overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">

  <div class="border-b border-gray-200 bg-gray-50 px-4 py-3 text-sm font-bold uppercase tracking-wider text-gray-700">
    Featured Products
  </div>

  <div class="flex flex-col p-4">
    <div ng-repeat="product in $ctrl.products track by product.id"
         class="flex items-center gap-4"
         ng-class="{ 'mb-4 border-b border-gray-100 pb-4': !$last }">

      <div class="w-1/3 shrink-0">
        <a ng-href="/product/detail/{{ ::product.id }}">
          <img ng-src="/{{ ::product.imageUrl }}"
               class="h-20 w-full rounded-md object-cover transition-opacity hover:opacity-80"
               alt="{{ ::product.name }}"
               loading="lazy" />
        </a>
      </div>

      <div class="flex-1">
        <h6 class="mb-1 text-sm font-medium capitalize leading-tight">
          <a ng-href="/product/detail/{{ ::product.id }}"
             class="text-gray-800 transition-colors hover:text-blue-600">{{ ::product.name }}</a>
        </h6>

        <div class="mb-1 flex items-center">
          <lucide-icon ng-repeat="star in ::$ctrl.stars(product) track by $index"
                       name="Star"
                       icon-class="mr-0.5 h-3 w-3 fill-yellow-400 text-yellow-400"></lucide-icon>
        </div>

        <div class="flex items-baseline">
          <span class="text-base font-bold text-gray-900">{{ ::product.price | currency:'$':2 }}</span>
          <span ng-if="::product.originPrice > 0"
                class="ml-2 text-xs text-gray-500 line-through">{{ ::product.originPrice | currency:'$':2 }}</span>
        </div>
      </div>

    </div>
  </div>
</div>
