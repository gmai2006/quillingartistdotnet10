server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # AngularJS html5Mode routing - fall back to index.html for any path that
    # isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api is reverse-proxied to the .NET backend container over the shared
    # proxy-net Docker network, so the browser sees it as same-origin (no CORS).
    #
    # The upstream is a variable resolved through Docker's embedded DNS at
    # request time, so nginx still starts (and 502s) if the backend isn't up.
    # No URI after the variable: nginx then forwards the original request URI.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_api http://quillingartistdotnet:8003;
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html references the content-hashed bundles, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~ ^/app\.[0-9a-f]+\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
